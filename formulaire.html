<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Madrid — Commande</title>
    <link rel="stylesheet" href="style2.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <section>
        <a href="index.html" class="logo"><i class="fa-solid fa-futbol"></i> Real Madrid</a>
            <h1>commander votre article</h1>
          <form action="commander">
            <div class="input-box">
                <div class="input">
                    <input type="text" placeholder="nom complet" required>
                </div>
                <div class="input">
                    <input type="tel" placeholder="numéro de téléphone" required>
                </div>
                <div class="input">
                    <input type="email" placeholder="adresse mail" required>
                </div>
            </div>
            <div class="option-box">
                <select name="article" id="article">
                   <option value="">tenue third</option>
                   <option value="">collection voyage</option>
                   <option value="">tenue à domicile</option>
                   <option value="">officielle entrainement</option>
                   <option value="">tenue gardien</option>
                   <option value="">survêtement</option>
                </select>
            </div>
            <div class="btn-sub">
                <button type="submit">commander</button>
            </div>

            <div class="retour">
                <a href="index.html">retour à la page d'accueil</a>
            </div>
          </form>

    </section>
</body>
</html>
